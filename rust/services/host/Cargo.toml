[package]
name = "host"
description = "The host kit: the reforged-host command line (MIGRATION_PLAN.md RH rows)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "reforged-host"
path = "src/main.rs"

[dependencies]
# RH4: dates in the files the game-data commands write, as JavaScript's toISOString.
chrono.workspace = true
clap.workspace = true
# RH4: game data packs are gzip-compressed JSON.
flate2.workspace = true
# host.json in JavaScript's key order and number text (service-kit turns on preserve_order).
serde_json.workspace = true
service-kit.workspace = true
# RH4: the hashes in preset.json, runtime.json, game data packs and the store-capture pin.
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
