# Fuzz targets for untrusted input (MIGRATION_PLAN.md RX3; DR's M33, X9), with cargo-fuzz on nightly, from rust/fuzz:
#   cargo +nightly fuzz run <target> -- -max_total_time=86400
# One target per parser of untrusted input, named after its component (each file in fuzz_targets/ says what
# it feeds); each component row adds its own target and a [[bin]] here, and the integration pass keeps
# this file merged. The components' security pages (docs/security/) list their targets.
# On Windows the AddressSanitizer runtime (clang_rt.asan_dynamic-x86_64.dll) must be on PATH: it is in
# the Visual Studio install, VC/Tools/MSVC/<version>/bin/Hostx64/x64. A workspace of its own: cargo fuzz
# needs nightly and its own build flags.
[package]
name = "reforged-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
admin = { path = "../services/admin" }
# admin_request: the query parser the admin API runs
async-graphql = { version = "7", default-features = false }
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
arbitrary = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
content = { path = "../services/content" }
flate2 = "1"
gateway = { path = "../services/gateway" }
host = { path = "../services/host" }
http = "1"
protocol = { path = "../crates/protocol" }
proxy = { path = "../crates/proxy" }
serde_json = "1"
# launcher_host: the launcher's host.toml reader
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
service-kit = { path = "../crates/service-kit" }
url = "2"

[[bin]]
name = "admin_request"
path = "fuzz_targets/admin_request.rs"
test = false
doc = false
bench = false

